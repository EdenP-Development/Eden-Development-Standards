name: Public website browser verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'website/public/**'
      - 'website/qa/browser_public.py'
      - '.github/workflows/public-website-browser.yml'
  pull_request:
    paths:
      - 'website/public/**'
      - 'website/qa/browser_public.py'
      - '.github/workflows/public-website-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.51.0
      - name: Install Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Render public checkout
        run: |
          set -o pipefail
          python website/qa/browser_public.py | tee "$RUNNER_TEMP/public-browser-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-results
          path: ${{ runner.temp }}/public-browser-results.json
          if-no-files-found: warn
          retention-days: 14
