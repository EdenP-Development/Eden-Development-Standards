name: Website publication preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'website/publication/**'
      - 'website/prototype/**'
      - 'branding/spudacus/v1.0/full-transparent.png'
      - 'branding/gridmates/v1.0/runtime-transparent.png'
      - 'branding/eps/v1.0/runtime-transparent.png'
      - '.github/workflows/website-publication.yml'
  pull_request:
    paths:
      - 'website/publication/**'
      - 'website/prototype/**'
      - 'branding/spudacus/v1.0/full-transparent.png'
      - 'branding/gridmates/v1.0/runtime-transparent.png'
      - 'branding/eps/v1.0/runtime-transparent.png'
      - '.github/workflows/website-publication.yml'
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression suite
        run: python -m unittest discover -s website/publication -v
      - name: Require rejection of unfilled production template
        shell: bash
        run: |
          set +e
          python website/publication/validate_publication.py website/publication/receipt-template.json
          status=$?
          set -e
          test "$status" -eq 1
      - name: Build pinned offline review archive
        run: python website/publication/package_review.py "$RUNNER_TEMP/eden-website-review.zip"
      - name: Retain review archive (not deployment)
        uses: actions/upload-artifact@v4
        with:
          name: eden-website-review-only
          path: ${{ runner.temp }}/eden-website-review.zip
          if-no-files-found: error
          retention-days: 14
